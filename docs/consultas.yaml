        consulta:
          $ref: '#/components/schemas/Consulta'

    Mensagem:
      type: object
      required:
        - mensagem
      properties:
        mensagem:
          type: string
          description: Mensagem informativa de sucesso
          example: Consulta excluída com sucesso

    Erro:
      type: object
      required:
        - erro
      properties:
        erro:
          type: string
          description: Detalhes do erro ocorrido
          example: Consulta não encontrada
